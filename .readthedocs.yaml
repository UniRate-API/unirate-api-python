# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Build-time only. The published docs are static HTML with no runtime deps.
# The package itself is not installed; `requests` is mocked in docs/conf.py.
python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
  - epub
